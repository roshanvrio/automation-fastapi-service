<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MINDSPRINT - Queue Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1628 0%, #1a2f4a 100%);
            color: #ffffff;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #00d4ff;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 212, 255, 0.3);
        }

        .stat-card h3 {
            color: #00d4ff;
            font-size: 0.9em;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffffff;
        }

        .stat-card.error .value {
            color: #ff4444;
        }

        .stat-card.success .value {
            color: #00ff88;
        }

        .vm-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .vm-box {
            aspect-ratio: 1;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .vm-box.active {
            background: linear-gradient(135deg, #00d4ff 0%, #0088ff 100%);
            border-color: #00d4ff;
        }

        .vm-box.pending {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            border-color: #ff6b6b;
        }

        .vm-box.inactive {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            color: #666;
        }

        .vm-box:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.4);
        }

        .bots-section {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 20px;
        }

        .bots-section h2 {
            color: #00d4ff;
            margin-bottom: 15px;
        }

        .bot-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .bot-item {
            background: rgba(0, 212, 255, 0.2);
            padding: 10px 20px;
            border-radius: 20px;
            border: 1px solid #00d4ff;
        }

        .refresh-indicator {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 212, 255, 0.2);
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 0.9em;
        }

        .last-update {
            text-align: center;
            margin-top: 20px;
            color: #888;
            font-size: 0.9em;
        }

        .section-title {
            color: #00d4ff;
            font-size: 1.5em;
            margin: 30px 0 15px 0;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="refresh-indicator" id="refreshIndicator">
        Next refresh in: <span id="countdown">30</span>s
    </div>

    <div class="header">
        <h1>MINDSPRINT - Queue Dashboard</h1>
        <p>Real-time VM Status Monitoring</p>
    </div>

    <div class="dashboard-container">
        <!-- Statistics Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>In Queue</h3>
                <div class="value" id="inQueueCount">-</div>
            </div>
            <div class="stat-card error">
                <h3>Errors</h3>
                <div class="value" id="errorCount">-</div>
            </div>
            <div class="stat-card">
                <h3>In Progress</h3>
                <div class="value" id="inProgressCount">-</div>
            </div>
            <div class="stat-card success">
                <h3>Completed</h3>
                <div class="value" id="completedCount">-</div>
            </div>
            <div class="stat-card">
                <h3>Avg. Execution Time</h3>
                <div class="value" id="avgExecTime">-</div>
                <small>minutes</small>
            </div>
            <div class="stat-card">
                <h3>Total Bots</h3>
                <div class="value" id="totalBots">-</div>
            </div>
        </div>

        <!-- Active VMs Section -->
        <div class="section-title">Active Virtual Machines</div>
        <div class="vm-grid" id="vmGrid">
            <!-- VM boxes will be dynamically generated -->
        </div>

        <!-- Bots in Progress -->
        <div class="bots-section">
            <h2>Bots Currently in Progress</h2>
            <div class="bot-list" id="botsList">
                <!-- Bot items will be dynamically generated -->
            </div>
        </div>

        <div class="last-update">
            Last updated: <span id="lastUpdate">-</span> |
            Data for: <span id="currentDate">-</span>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000';
        let countdownTimer = 30;
        let countdownInterval;

        // Fetch all data
        async function fetchDashboardData() {
            try {
                // Fetch process statistics
                const statsResponse = await fetch(`${API_BASE_URL}/process-statistics/`);
                const stats = await statsResponse.json();

                // Fetch VM status
                const vmResponse = await fetch(`${API_BASE_URL}/vm-status`);
                const vmData = await vmResponse.json();

                // Fetch bots in progress
                const botsResponse = await fetch(`${API_BASE_URL}/bots-in-progress`);
                const botsData = await botsResponse.json();

                // Update UI
                updateStatistics(stats);
                updateVMGrid(vmData);
                updateBotsInProgress(botsData);

                // Update last update time
                document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString();
                document.getElementById('currentDate').textContent = stats.date || new Date().toLocaleDateString();

            } catch (error) {
                console.error('Error fetching dashboard data:', error);
            }
        }

        // Update statistics cards
        function updateStatistics(stats) {
            document.getElementById('inQueueCount').textContent = stats.in_queue || 0;
            document.getElementById('errorCount').textContent = stats.failed || 0;
            document.getElementById('inProgressCount').textContent = stats.in_progress || 0;
            document.getElementById('completedCount').textContent = stats.completed || 0;
            document.getElementById('avgExecTime').textContent = stats.avg_exec_time_mins || 0;
            document.getElementById('totalBots').textContent = stats.total_processes || 0;
        }

        // Update VM grid
        function updateVMGrid(vmData) {
            const vmGrid = document.getElementById('vmGrid');
            vmGrid.innerHTML = '';

            // Create VM boxes for VM_01 to VM_35 (or adjust based on your needs)
            const totalVMs = 35;
            const activeVMs = new Map();

            // Map active VMs
            if (vmData.machines) {
                vmData.machines.forEach(vm => {
                    activeVMs.set(vm.machine_name, vm);
                });
            }

            // Create boxes for all VMs
            for (let i = 1; i <= totalVMs; i++) {
                const vmName = `VM_${String(i).padStart(2, '0')}`;
                const vmBox = document.createElement('div');
                vmBox.className = 'vm-box';

                const vmInfo = activeVMs.get(vmName);
                if (vmInfo) {
                    vmBox.classList.add(vmInfo.status);
                    vmBox.title = `${vmName} - ${vmInfo.status.toUpperCase()}\nBot: ${vmInfo.bot_id}`;
                } else {
                    vmBox.classList.add('inactive');
                    vmBox.title = `${vmName} - Inactive`;
                }

                vmBox.textContent = vmName;
                vmGrid.appendChild(vmBox);
            }
        }

        // Update bots in progress
        function updateBotsInProgress(botsData) {
            const botsList = document.getElementById('botsList');
            botsList.innerHTML = '';

            if (botsData.bots && botsData.bots.length > 0) {
                botsData.bots.forEach(bot => {
                    const botItem = document.createElement('div');
                    botItem.className = 'bot-item';
                    botItem.textContent = `${bot.name} (${bot.vm})`;
                    botsList.appendChild(botItem);
                });
            } else {
                botsList.innerHTML = '<p style="color: #888;">No bots currently in progress</p>';
            }
        }

        // Countdown timer
        function startCountdown() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }

            countdownTimer = 30;
            document.getElementById('countdown').textContent = countdownTimer;

            countdownInterval = setInterval(() => {
                countdownTimer--;
                document.getElementById('countdown').textContent = countdownTimer;

                if (countdownTimer <= 0) {
                    fetchDashboardData();
                    countdownTimer = 30;
                }
            }, 1000);
        }

        // Initialize dashboard
        function initDashboard() {
            fetchDashboardData(); // Initial fetch
            startCountdown(); // Start countdown timer

            // Refresh every 30 seconds
            setInterval(() => {
                fetchDashboardData();
            }, 30000);
        }

        // Start when page loads
        globalThis.addEventListener('DOMContentLoaded', initDashboard);

        // Check for new day and reset at midnight
        setInterval(() => {
            const now = new Date();
            if (now.getHours() === 0 && now.getMinutes() === 0 && now.getSeconds() === 0) {
                console.log('New day detected - refreshing dashboard');
                fetchDashboardData();
            }
        }, 1000);
    </script>
</body>
</html>
